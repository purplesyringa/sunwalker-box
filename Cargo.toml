cargo-features = ["panic-immediate-abort"]

[package]
name = "sunwalker_box"
version = "0.1.0"
edition = "2024"
authors = ["Alisa Sireneva <me@purplesyringa.moe>"]
license = "Apache-2.0"
description = "Sandbox for sunwalker judge system"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { git = "https://github.com/purplesyringa/anyhow", branch = "optout-backtrace", features = ["no_backtrace"]}
argh = "0.1.9"
crossmist = { version = "1.1.2", features = ["nightly"], git = "https://github.com/purplesyringa/crossmist", rev = "971620f" }
nix = { version = "0.29.0", features = ["process", "ptrace", "signal"] }
rand = "0.8.5"
miniserde = "0.1"
miniserde-enum = { git = "https://github.com/yuki0iq/miniserde-enum", version = "0.1.3" }
linux-raw-sys = { version = "0.12.1", features = ["system", "ptrace"] }
rustix = { version = "1.0.8", default-features = false, features = ["event", "fs", "linux_latest", "mount", "param", "process", "std", "stdio", "system", "thread", "time"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "immediate-abort"
